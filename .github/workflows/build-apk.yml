name: Build FitCoach Pro debug APK

# Builds on GitHub's cloud runners, which have normal internet access to
# dl.google.com / Maven Central - unlike the sandbox this project's Android
# source was originally written in, which has neither. This is how you get
# an actual compiled .apk without installing Android Studio locally.
#
# Uses `gradle` directly via gradle/actions/setup-gradle rather than
# `./gradlew`, because android/gradle/wrapper/gradle-wrapper.jar was never
# generated (same network restriction) - this action provisions the Gradle
# binary itself and puts it on PATH, sidestepping the missing wrapper jar
# entirely. If you later generate the wrapper jar yourself (see
# android/README.md), you can switch this to `./gradlew assembleDebug`
# instead - either works.

"on":
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {} # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitcoach-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
